# Sveltia CMS configuration — David's content manager.
#
# backend.repo MUST be set to  <your-github-username>/davidproud  before this works live.
# Placeholder below is filled in during deploy.
backend:
  name: github
  repo: asaffulks/davidproud
  branch: main
  # Self-hosted OAuth relay (sveltia-cms-auth Worker on Asaf's Cloudflare).
  base_url: https://sveltia-cms-auth.asaffulks.workers.dev

# Lets David preview/edit against a local copy during setup without logging in.
local_backend: true

# Uploaded pictures land in public/uploads and are served from /uploads.
media_folder: "public/uploads"
public_folder: "/uploads"

# Shrink pictures in the browser before they're saved: converted to WebP and
# capped at 2048px on the long side. A 6 MB phone photo becomes ~300 KB, so the
# repository and the site stay fast no matter how many photos are added.
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2048
          height: 2048
        svg:
          optimize: true

# A friendly editing experience. Writings (philosophy) and Poetry are two views
# over the same folder, split by the hidden "category" field — each tab stamps
# the right category automatically when David creates a new piece.
collections:
  - name: "writings"
    label: "Writings"
    label_singular: "Writing"
    folder: "src/content/writings"
    filter: { field: "category", value: "Philosophy" }
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}}  ·  {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD MMMM YYYY", time_format: false }
      - { label: "Type", name: "category", widget: "hidden", default: "Philosophy" }
      - { label: "Short summary (optional)", name: "excerpt", widget: "string", required: false, hint: "One line shown on the home page under the title." }
      - { label: "Picture (optional)", name: "image", widget: "image", required: false, hint: "A photo or artwork shown at the top of this piece." }
      - { label: "Save as draft (hide from site)", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown", hint: "Write your essay or article here." }

  - name: "poetry"
    label: "Poetry"
    label_singular: "Poem"
    folder: "src/content/writings"
    filter: { field: "category", value: "Poetry" }
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}}  ·  {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD MMMM YYYY", time_format: false }
      - { label: "Type", name: "category", widget: "hidden", default: "Poetry" }
      - { label: "Short summary (optional)", name: "excerpt", widget: "string", required: false, hint: "One line shown on the home page under the title." }
      - { label: "Picture (optional)", name: "image", widget: "image", required: false, hint: "A photo or artwork shown at the top of this poem." }
      - { label: "Save as draft (hide from site)", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown", hint: "Write your poem here." }

  - name: "photos"
    label: "Photos"
    label_singular: "Photo"
    folder: "src/content/photos"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}}  ·  {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "A short name for the photograph — shown beneath it in the gallery." }
      - { label: "Photograph", name: "image", widget: "image", hint: "The picture itself. It is resized automatically, so upload straight from your phone or camera." }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD MMMM YYYY", time_format: false, hint: "Newest photographs appear first." }
      - { label: "Caption (optional)", name: "caption", widget: "string", required: false, hint: "A line about the photo — where or when it was taken." }
      - { label: "Hide from site", name: "draft", widget: "boolean", default: false }

  - name: "testimonials"
    label: "Testimonials"
    label_singular: "Testimonial"
    folder: "src/content/testimonials"
    create: true
    delete: true
    slug: "{{name}}"
    summary: "{{name}}  ·  {{role}}"
    sortable_fields: ["order", "name"]
    fields:
      - { label: "Name", name: "name", widget: "string", hint: "Who said it — e.g. 'A. Smith'." }
      - { label: "Role (optional)", name: "role", widget: "string", required: false, hint: "e.g. 'Philosophy undergraduate' or 'Private student'." }
      - { label: "Order", name: "order", widget: "number", default: 0, value_type: "int", hint: "Lower numbers appear first. The first one is featured on the home page." }
      - { label: "Hide from site", name: "draft", widget: "boolean", default: false }
      - { label: "The testimonial", name: "body", widget: "markdown", hint: "The quote itself." }

  - name: "pages"
    label: "Pages"
    files:
      - name: "home"
        label: "Home page"
        file: "src/content/pages/home.md"
        fields:
          - { label: "Title", name: "title", widget: "hidden", default: "Home" }
          - { label: "Tutoring blurb", name: "tutoringText", widget: "text", hint: "The short tutoring paragraph in the dark band on the home page." }
          - { label: "Correspondence line", name: "contactText", widget: "text", hint: "The invitation line above the 'Get in touch' button." }
          - { label: "Introduction", name: "body", widget: "markdown", hint: "The short introduction shown under the Hegel quote at the top of the home page." }
      - name: "about"
        label: "About page"
        file: "src/content/pages/about.md"
        fields:
          - { label: "Title", name: "title", widget: "hidden", default: "About" }
          - { label: "About text", name: "body", widget: "markdown", hint: "The biography shown on the About page." }
      - name: "tutoring"
        label: "Tutoring page"
        file: "src/content/pages/tutoring.md"
        fields:
          - { label: "Title", name: "title", widget: "hidden", default: "Tutoring" }
          - { label: "Tutoring text", name: "body", widget: "markdown", hint: "The description shown on the Tutoring page." }
      - name: "contact"
        label: "Contact page"
        file: "src/content/pages/contact.md"
        fields:
          - { label: "Title", name: "title", widget: "hidden", default: "Contact" }
          - { label: "Email", name: "email", widget: "string", required: false, hint: "Your email address, shown on the Contact page. Leave blank to show nothing yet." }
          - { label: "LinkedIn", name: "linkedin", widget: "string", required: false, hint: "The full web address of your LinkedIn profile, e.g. https://www.linkedin.com/in/yourname" }
          - { label: "Intro text", name: "body", widget: "markdown", hint: "The welcome line at the top of the Contact page." }
